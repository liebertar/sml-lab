[project]
name = "sml-lab"
version = "0.1.0"
description = "Small-model experiments on Apple Silicon, deployed to the browser"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.30",
    "mlx-lm>=0.30",
    "numpy>=2",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "pillow>=11",
    "rich>=13",
]

[project.optional-dependencies]
torch = ["torch>=2.6", "torchvision>=0.21"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py312"
